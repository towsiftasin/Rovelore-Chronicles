<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirit – The Journey and a Surprising Discovery</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0b2a;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
  }

  /* ===== BACKGROUND =====
     Layer 1 (.backdrop): the same picture, blurred, filling the whole screen,
                          so there are never empty black bars.
     Layer 2 (.scene)   : the picture itself. The script sets how it fits
                          (see FIT at the top of the script).            */
  .backdrop {
    position: fixed;
    inset: -30px;
    background-image: url("../images/spirit rover/scene4.png");
    background-size: cover;
    background-position: center;
    filter: blur(24px) brightness(0.8);
  }
  .scene {
    position: fixed;
    inset: 0;
    background-image: url("../images/spirit rover/scene4.png");
    background-size: contain;          /* the script changes this to match FIT  */
    background-position: center;
    background-repeat: no-repeat;
  }

  .speech {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.9) translateY(8px);
    transition: opacity 550ms ease, transform 550ms cubic-bezier(.2, .9, .3, 1.2);
    filter: drop-shadow(0 4px 10px rgba(0, 0, 20, 0.45));
  }
  .speech.show { opacity: 1; transform: scale(1) translateY(0); }

  .bubble {
    position: absolute;
    box-sizing: border-box;
    width: max-content;
    max-width: 220px;
    padding: 12px 16px;
    background: rgba(40, 30, 110, 0.72);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    border: 1.5px solid rgba(255, 255, 255, 0.7);
    border-radius: 18px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(5, 5, 40, 0.8);
    font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", "Segoe UI", sans-serif;
    box-shadow: 0 0 16px rgba(150, 130, 255, 0.25);
  }

  .speaker-name {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #ffd76a;
    text-shadow: 0 1px 2px rgba(5, 5, 40, 0.9);
    margin-bottom: 4px;
  }

  .bubble-text {
    display: block;
    font-size: 17px;
    line-height: 1.4;
    font-weight: 600;
    white-space: pre-line;
  }

  .tail { position: absolute; background: rgba(78, 62, 185, 0.92); }

  /* ===== BUTTON GROUPS =====
     Left  group (bottom-left):  BACK + EXIT
     Right group (bottom-right): AUTOPLAY + NEXT                        */
  .left-btns,
  .right-btns {
    position: fixed;
    bottom: 24px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .left-btns  { left: 24px; }
  .right-btns { right: 24px; }

  /* All the small pill buttons share one look */
  .back-btn,
  .exit-btn,
  .auto-btn,
  .next-btn {
    padding: 9px 22px;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #fff;
    background: rgba(40, 30, 110, 0.82);
    border: 1.5px solid rgba(255, 255, 255, 0.7);
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0, 0, 20, 0.4), 0 0 12px rgba(150, 130, 255, 0.35);
    transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease, color 200ms ease;
  }
  .back-btn:hover,
  .exit-btn:hover,
  .auto-btn:hover {
    transform: scale(1.07);
    background: rgba(90, 70, 210, 0.95);
    box-shadow: 0 4px 14px rgba(0, 0, 20, 0.45), 0 0 20px rgba(170, 150, 255, 0.75);
  }
  .back-btn:active,
  .exit-btn:active,
  .auto-btn:active { transform: scale(0.95); }
  .back-btn:focus-visible,
  .exit-btn:focus-visible,
  .auto-btn:focus-visible,
  .next-btn:focus-visible { outline: 3px solid #ffd76a; outline-offset: 2px; }

  /* AUTOPLAY turns gold while it is running */
  .auto-btn.on {
    color: #2a1f00;
    background: #ffd76a;
    border-color: #fff3c4;
    box-shadow: 0 3px 10px rgba(0, 0, 20, 0.4), 0 0 18px rgba(255, 215, 106, 0.8);
  }
  .auto-btn.on:hover { background: #ffe08a; }

  /* NEXT / CONTINUE fades in with each line */
  .next-btn {
    opacity: 0;
    visibility: hidden;
    transform: translateY(6px);
    transition: opacity 400ms ease, transform 200ms ease, box-shadow 200ms ease, background 200ms ease;
  }
  .next-btn.show { opacity: 1; visibility: visible; transform: translateY(0); }
  .next-btn.show:hover {
    transform: scale(1.07);
    background: rgba(90, 70, 210, 0.95);
    box-shadow: 0 4px 14px rgba(0, 0, 20, 0.45), 0 0 20px rgba(170, 150, 255, 0.75);
  }
  .next-btn.show:active { transform: scale(0.95); }

  @media (max-width: 700px) {
    .bubble { max-width: 190px; padding: 10px 13px; border-radius: 15px; }
    .bubble-text { font-size: 15px; }
    .left-btns  { left: 12px;  bottom: 14px; gap: 6px; }
    .right-btns { right: 12px; bottom: 14px; gap: 6px; }
    .back-btn, .exit-btn, .auto-btn, .next-btn { font-size: 11px; padding: 7px 12px; letter-spacing: 1px; }
  }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true"></div>
<div class="scene" id="scene">
  <div class="speech" id="speech">
    <div class="bubble" id="bubble">
      <span class="speaker-name" id="speakerName"></span>
      <span class="bubble-text" id="bubbleText"></span>
    </div>
    <div class="tail" id="tail"></div>
  </div>
</div>

<div class="left-btns">
  <button class="back-btn" id="backBtn" type="button">BACK</button>
  <button class="exit-btn" id="exitBtn" type="button">EXIT</button>
</div>
<div class="right-btns">
  <button class="auto-btn" id="autoBtn" type="button" aria-pressed="false">&#9654; AUTOPLAY</button>
  <button class="next-btn" id="nextBtn" type="button">NEXT</button>
</div>

<script>
  // Set these file names
  const BACK_PAGE = "scene3.html";                    // where the BACK button goes (previous scene)
  const EXIT_PAGE = "../mainhtml/mars.html";          // where the EXIT button goes (the map page)
  const NEXT_PAGE = "scene5.html";                    // where CONTINUE goes (fill in later)

  /* ===== AUTOPLAY =====
     When AUTOPLAY is on, every line moves on by itself after a reading
     pause, and the last line goes straight to the next scene, so nobody has
     to tap NEXT or CONTINUE. The setting is remembered for the whole visit,
     so the next scene keeps playing too (as long as that page has this same
     code). Reading time per line = AUTO_BASE + AUTO_PER_CHAR * letters.   */
  const AUTO_BASE = 1800;      // milliseconds every line waits at least
  const AUTO_PER_CHAR = 55;    // extra milliseconds for each letter in the line
  const AUTO_MIN = 3000;       // never shorter than this
  const AUTO_KEY = "storyAutoplay";

  const dialogues = [
    { name: "Maya", text: "Now I understand its parts! But when did Spirit begin its adventure?", position: "maya", type: "long" },
    { name: "Commander Lena", text: "Spirit launched on June 10, 2003, and landed in Mars' Gusev Crater on January 4, 2004, Universal Time.", position: "lena", type: "long" },
    { name: "Maya", text: "Did Spirit discover anything exciting during its adventure?", position: "maya", type: "medium" },
    { name: "Commander Lena", text: "Yes! A struggling wheel scraped away soil and exposed bright material rich in silica.", position: "lena", type: "long" },
    { name: "Maya", text: "Wait! A wheel problem helped scientists make a discovery?", position: "maya", type: "medium" },
    { name: "Commander Lena", text: "Exactly! The silica-rich material suggested that hot water or steam had changed the ground long ago.", position: "lena", type: "long" }
  ];

  /* ---- Artwork geometry (pixels of the original 1836 x 856 image) --------
     This picture is very wide (about 2.15:1). FIT is "cover", so it fills
     the whole screen; on a 16:9 screen a little is cropped from each side.
     x / y   : the speaker's mouth in the image
     side    : which side of the mouth the bubble sits on
     gap     : distance from the mouth to the bubble's near edge
     tipDx   : where the pointer tip ends, relative to the mouth
               (negative = the pointer stops short, to the left of the mouth)
     bottomDy: bubble bottom relative to mouth height (negative = higher)
     anchor / dy : with anchor "top", the bubble's TOP edge sits dy below the
                   mouth instead (negative dy = above the mouth)
     tailAt  : "bottom" puts the pointer on the bubble's bottom edge,
               anything else puts it on the side facing the mouth

     Lena (behind, black hair) and Maya (in front, red hair) are crouching
     at the right edge, looking left toward the rover. Spirit's mast and
     wheel are right beside them, so the bubbles stay away from the rover:
       - Lena's bubble floats in the sky/horizon, to the left of the rover.
       - Maya's bubble sits on the desert floor, below the rover and the
         pointing hand, beside the dusty trail.

     !! The x / y values are my best estimate from the picture. If a pointer
     does not land on the mouth, nudge x / y (or bottomDy / dy / tipDx).
     Lena = x 1262, y 372.
     Maya = x 1418, y 505.                                                  */
  const IMG_W = 1836, IMG_H = 856;

  /* ===== HOW THE PICTURE FITS THE SCREEN =====
     "contain" = the WHOLE picture is always visible, nothing is cut off
                 (a blurred copy fills any leftover space).
     "cover"   = the picture fills the screen, but the edges get cropped.  */
  const FIT = "cover";
  const FOCUS_Y = 0.5;   // only used with "cover": 0 = keep the top, 1 = keep the bottom
  const SPOTS = {
    maya: { x: 1418, y: 505, side: "left", gap: 273, tipDx: -120, anchor: "top", dy: 100, tailAt: "side" },
    lena: { x: 1262, y: 372, side: "left", gap: 382, tipDx: -230, bottomDy: -45, tailAt: "side" }
  };
  const WIDTHS = { short: 200, medium: 270, long: 360 };

  const speech      = document.getElementById("speech");
  const bubble      = document.getElementById("bubble");
  const tail        = document.getElementById("tail");
  const speakerName = document.getElementById("speakerName");
  const bubbleText  = document.getElementById("bubbleText");
  const btn         = document.getElementById("nextBtn");
  const backBtn     = document.getElementById("backBtn");
  const exitBtn     = document.getElementById("exitBtn");
  const autoBtn     = document.getElementById("autoBtn");

  let currentDialogue = 0;
  let current = null;
  let currentWidth = WIDTHS.short;
  let busy = false;
  let autoplay = false;
  let autoTimer = null;

  function positionBubble() {
    if (!current) return;
    const spot = SPOTS[current];
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = (FIT === "contain") ? Math.min(vw / IMG_W, vh / IMG_H) : Math.max(vw / IMG_W, vh / IMG_H);
    const iw = IMG_W * s, ih = IMG_H * s;
    const ox = (vw - iw) / 2;
    const oy = (FIT === "contain") ? (vh - ih) / 2 : (vh - ih) * FOCUS_Y;

    const mx = ox + spot.x * s;
    const my = oy + spot.y * s;
    const margin = 10;

    const nearEdge = spot.side === "right" ? mx + spot.gap * s : mx - spot.gap * s;
    const avail = spot.side === "right" ? vw - nearEdge - margin : nearEdge - margin;
    let maxW = vw <= 700 ? Math.min(190, avail) : Math.min(currentWidth, vw * 0.32, avail);
    maxW = Math.max(maxW, 130);
    bubble.style.maxWidth = maxW + "px";

    const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    let bx = spot.side === "right" ? nearEdge : nearEdge - bw;
    bx = Math.max(margin, Math.min(bx, vw - margin - bw));
    let by = spot.anchor === "top" ? my + spot.dy * s : my + spot.bottomDy * s - bh;
    by = Math.max(margin, Math.min(by, vh - margin - bh));
    const bottom = by + bh;

    bubble.style.left = bx + "px";
    bubble.style.top = by + "px";

    // Pointer: a small triangle whose base sits on the bubble edge and whose
    // tip stops part-way to the mouth (TAIL_LENGTH: 1 = reaches the mouth).
    const TAIL_LENGTH = 0.55;
    const fullX = mx + spot.tipDx * s, fullY = my;
    let p1, p2;
    if (spot.tailAt === "bottom") {          // base on the bubble's bottom edge
      const ex = spot.side === "left" ? bx + bw - 26 : bx + 56;
      p1 = [ex - 30, bottom - 1]; p2 = [ex, bottom - 1];
    } else {                                  // base on the side facing the mouth
      const ex = spot.side === "right" ? bx + 2 : bx + bw - 2;
      const t = spot.anchor === "top" ? by + 10 : Math.max(by + 10, bottom - 32);
      const u = spot.anchor === "top" ? by + 32 : Math.max(by + 20, bottom - 10);
      p1 = [ex, t]; p2 = [ex, u];
    }
    const sx = (p1[0] + p2[0]) / 2, sy = (p1[1] + p2[1]) / 2;
    const tip = [sx + (fullX - sx) * TAIL_LENGTH, sy + (fullY - sy) * TAIL_LENGTH];
    const xs = [p1[0], p2[0], tip[0]], ys = [p1[1], p2[1], tip[1]];
    const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    const minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    tail.style.left = minX + "px";
    tail.style.top = minY + "px";
    tail.style.width = (maxX - minX) + "px";
    tail.style.height = (maxY - minY) + "px";
    tail.style.clipPath = "polygon(" +
      [p1, p2, tip].map(function (q) { return (q[0] - minX) + "px " + (q[1] - minY) + "px"; }).join(", ") + ")";

    speech.style.transformOrigin = mx + "px " + my + "px";
  }

  /* ---------- AUTOPLAY ---------- */
  function readingTime(i) {
    const len = dialogues[i].text.length;
    return Math.max(AUTO_MIN, AUTO_BASE + AUTO_PER_CHAR * len);
  }

  function scheduleAuto() {
    clearTimeout(autoTimer);
    if (!autoplay) return;
    autoTimer = setTimeout(nextDialogue, readingTime(currentDialogue));
  }

  function setAutoplay(on) {
    autoplay = on;
    autoBtn.classList.toggle("on", on);
    autoBtn.setAttribute("aria-pressed", on ? "true" : "false");
    autoBtn.innerHTML = on ? "&#10074;&#10074; PAUSE" : "&#9654; AUTOPLAY";
    try { sessionStorage.setItem(AUTO_KEY, on ? "on" : "off"); } catch (e) {}
    if (on) scheduleAuto();
    else clearTimeout(autoTimer);
  }

  function showDialogue(i) {
    const d = dialogues[i];
    const reveal = function () {
      speakerName.textContent = d.name;
      bubbleText.textContent = d.text;
      current = d.position;
      currentWidth = WIDTHS[d.type] || WIDTHS.short;
      positionBubble();
      void speech.offsetWidth;
      speech.classList.add("show");
      btn.textContent = i === dialogues.length - 1 ? "CONTINUE" : "NEXT";
      btn.classList.add("show");
      busy = false;
      scheduleAuto();            // start the reading pause for this line
    };

    if (speech.classList.contains("show")) {
      busy = true;
      speech.classList.remove("show");
      setTimeout(reveal, 380);
    } else {
      reveal();
    }
  }

  function nextDialogue() {
    if (busy) return;
    clearTimeout(autoTimer);
    if (currentDialogue >= dialogues.length - 1) {
      goToNextScene();
      return;
    }
    currentDialogue++;
    showDialogue(currentDialogue);
  }

  function goToNextScene() {
    if (NEXT_PAGE) {
      window.location.href = NEXT_PAGE;   // autoplay (if on) carries on in the next scene
    } else {
      setAutoplay(false);                 // nothing after this scene, so stop
    }
  }

  // Make the picture fit the way FIT says
  document.getElementById("scene").style.backgroundSize = FIT;
  document.getElementById("scene").style.backgroundPosition = (FIT === "cover") ? "center " + (FOCUS_Y * 100) + "%" : "center";

  // BACK and EXIT both stop autoplay before leaving
  backBtn.addEventListener("click", function () {
    setAutoplay(false);
    window.location.href = BACK_PAGE;
  });
  exitBtn.addEventListener("click", function () {
    setAutoplay(false);
    window.location.href = EXIT_PAGE;
  });

  autoBtn.addEventListener("click", function () {
    setAutoplay(!autoplay);
  });

  btn.addEventListener("click", nextDialogue);
  document.addEventListener("click", function (e) {
    if (!e.target.closest("button")) nextDialogue();   // click anywhere else = next
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      if (document.activeElement.tagName !== "BUTTON") { e.preventDefault(); nextDialogue(); }
    }
  });
  window.addEventListener("resize", positionBubble);

  window.addEventListener("load", function () {
    currentDialogue = 0;
    let saved = false;
    try { saved = sessionStorage.getItem(AUTO_KEY) === "on"; } catch (e) {}
    setAutoplay(saved);
    setTimeout(function () { showDialogue(0); }, 500);
  });
</script>
<script src="voice.js"></script>
</body>
</html>
