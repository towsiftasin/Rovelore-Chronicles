<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Great Job! – Sojourner Story Complete</title>
<style>
/* =========================================================
   COLORS – change them here and the whole page updates
   ========================================================= */
:root {
  --space-deep:  #0b0b2a;
  --space-blue:  #1b1a6b;
  --space-purple:#5b2f9e;
  --sunset-pink: #ff7a8a;
  --mars-orange: #ff8a3d;
  --mars-red:    #d9452b;
  --gold:        #ffd76a;
  --glass-edge:  rgba(255, 255, 255, 0.7);
  --font: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  /* ===== YOUR BACKGROUND IMAGE: put your image path inside url("...") ===== */
  background: var(--space-deep) url("../images/background1.png") center / cover no-repeat fixed;
  font-family: var(--font);
  color: #fff;
  overflow-x: hidden;
}

/* floating particles + celebration sparks */
@keyframes floatUp {
  0%   { transform: translateY(0) translateX(0); opacity: 0; }
  15%  { opacity: 1; }
  100% { transform: translateY(-105vh) translateX(var(--drift)); opacity: 0; }
}
.spark {
  position: fixed;
  z-index: 5;
  color: var(--gold);
  text-shadow: 0 0 10px rgba(255, 215, 106, 0.95);
  pointer-events: none;
  animation: sparkBurst 1.5s ease-out forwards;
}
@keyframes sparkBurst {
  0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(200deg); opacity: 0; }
}

/* =========================================================
   LAYOUT
   ========================================================= */
.stage {
  position: relative;
  z-index: 3;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

/* =========================================================
   GLASS / HOLOGRAM CARD
   ========================================================= */
.card {
  position: relative;
  width: min(640px, 100%);
  padding: 20px 20px 10px;
  text-align: center;
  animation: cardIn 900ms cubic-bezier(.2, .9, .3, 1.15) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: scale(0.9) translateY(18px); }
  to   { opacity: 1; transform: none; }
}

/* =========================================================
   TEXT
   ========================================================= */

h1 {
  margin: 0;
  font-size: clamp(3.2rem, 11vw, 6.2rem);
  line-height: 1.05;
  font-weight: 800;
  color: #fff4cf;
  -webkit-text-stroke: 1px rgba(255, 160, 60, 0.35);
  animation: titleGlow 2.8s ease-in-out infinite;
}

.subtitle {
  margin: 10px 0 12px;
  font-size: clamp(1.25rem, 3.6vw, 1.7rem);
  font-weight: 700;
  text-shadow: 0 2px 4px rgba(5, 5, 40, 0.7);
}

/* =========================================================
   BUTTONS
   ========================================================= */
.buttons {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}
.btn {
  min-width: 190px;
  padding: 14px 28px;
  border-radius: 999px;
  border: 1.5px solid rgba(255, 255, 255, 0.8);
  font-family: var(--font);
  font-size: 1.05rem;
  font-weight: 800;
  letter-spacing: 1px;
  text-decoration: none;
  color: #fff;
  cursor: pointer;
  transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease;
}
.btn-primary {
  background: linear-gradient(180deg, #ff9a4a, #e5502a);
  box-shadow: 0 4px 14px rgba(0, 0, 20, 0.4), 0 0 18px rgba(255, 140, 70, 0.6);
}
.btn-secondary {
  background: rgba(40, 30, 110, 0.82);
  box-shadow: 0 4px 14px rgba(0, 0, 20, 0.4), 0 0 14px rgba(150, 130, 255, 0.4);
}
.btn:hover   { transform: translateY(-3px) scale(1.06); }
.btn-primary:hover   { box-shadow: 0 6px 18px rgba(0,0,20,.45), 0 0 32px rgba(255,170,90,.95); }
.btn-secondary:hover { background: rgba(90, 70, 210, 0.95); box-shadow: 0 6px 18px rgba(0,0,20,.45), 0 0 28px rgba(170,150,255,.85); }
.btn:active  { transform: scale(0.96); }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }



/* =========================================================
   TABLET + PHONE
   ========================================================= */
@media (max-width: 520px) {
  .card { padding: 20px 6px 10px; }
  .btn { width: 100%; }
}

/* kind to people who prefer less motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div id="particles" aria-hidden="true"></div>

<!-- ========== MAIN CONTENT ========== -->
<main class="stage">

  <section class="card" id="card" aria-labelledby="title">
    <h1 id="title">Great Job!</h1>
    <p class="subtitle">You have completed the story.</p>

    <!-- Buttons: change the href values to your real pages -->
    <div class="buttons">
      <a class="btn btn-primary" href="mars.html">Map</a>
      <a class="btn btn-secondary" href="index3.html">Start the Journey</a>
    </div>
  </section>
</main>
</body>
</html>
