<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet Commander Lena and Maya</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0b2a;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
  }

  /* Fixed background – the uploaded artwork, untouched and never moved */
  .scene {
    position: fixed;
    inset: 0;
    background-image: url("../images/scene-intro.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  .speech {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.9) translateY(8px);
    transition: opacity 550ms ease, transform 550ms cubic-bezier(.2, .9, .3, 1.2);
    filter: drop-shadow(0 4px 10px rgba(0, 0, 20, 0.45));
  }
  .speech.show { opacity: 1; transform: scale(1) translateY(0); }

  .bubble {
    position: absolute;
    box-sizing: border-box;
    width: max-content;
    max-width: 220px;
    padding: 12px 16px;
    background: rgba(40, 30, 110, 0.72);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    border: 1.5px solid rgba(255, 255, 255, 0.7);
    border-radius: 18px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(5, 5, 40, 0.8);
    font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", "Segoe UI", sans-serif;
    box-shadow: 0 0 16px rgba(150, 130, 255, 0.25);
  }

  .speaker-name {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #ffd76a;
    text-shadow: 0 1px 2px rgba(5, 5, 40, 0.9);
    margin-bottom: 4px;
  }

  .bubble-text {
    display: block;
    font-size: 17px;
    line-height: 1.4;
    font-weight: 600;
    white-space: pre-line;
  }

  .tail { position: absolute; background: rgba(78, 62, 185, 0.92); }

  /* Button row: SKIP sits beside NEXT / CONTINUE */
  .btn-row {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .next-btn {
    padding: 9px 22px;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #fff;
    background: rgba(40, 30, 110, 0.82);
    border: 1.5px solid rgba(255, 255, 255, 0.7);
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0, 0, 20, 0.4), 0 0 12px rgba(150, 130, 255, 0.35);
    opacity: 0;
    visibility: hidden;
    transform: translateY(6px);
    transition: opacity 400ms ease, transform 200ms ease, box-shadow 200ms ease, background 200ms ease;
  }
  .next-btn.show { opacity: 1; visibility: visible; transform: translateY(0); }
  .next-btn.show:hover {
    transform: scale(1.07);
    background: rgba(90, 70, 210, 0.95);
    box-shadow: 0 4px 14px rgba(0, 0, 20, 0.45), 0 0 20px rgba(170, 150, 255, 0.75);
  }
  .next-btn.show:active { transform: scale(0.95); }
  .next-btn:focus-visible { outline: 3px solid #ffd76a; outline-offset: 2px; }

  /* Skip is the same design, just a little softer so NEXT stays the main button */
  .skip-btn { background: rgba(40, 30, 110, 0.55); }

  @media (max-width: 700px) {
    .bubble { max-width: 190px; padding: 10px 13px; border-radius: 15px; }
    .bubble-text { font-size: 15px; }
    .btn-row { right: 16px; bottom: 16px; gap: 8px; }
    .next-btn { font-size: 12px; padding: 7px 16px; }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="speech" id="speech">
    <div class="bubble" id="bubble">
      <span class="speaker-name" id="speakerName"></span>
      <span class="bubble-text" id="bubbleText"></span>
    </div>
    <div class="tail" id="tail"></div>
  </div>
</div>

<div class="btn-row">
  <button class="next-btn skip-btn" id="skipBtn" type="button">SKIP</button>
  <button class="next-btn" id="nextBtn" type="button">NEXT</button>
</div>

<script>
  const dialogues = [
    { name: "Commander Lena", text: "Hello, explorer! I'm Commander Lena.", position: "lena", type: "medium" },
    { name: "Commander Lena", text: "I'll be your guide on our journey through space.", position: "lena", type: "medium" },
    { name: "Maya", text: "Hi! I'm Maya!", position: "maya", type: "short" },
    { name: "Maya", text: "Let's discover amazing worlds and the stories they hold!", position: "maya", type: "long" }
  ];

  /* ---- Artwork geometry (pixels of the original 1536 x 1024 image) -------
     x / y   : the speaker's mouth in the image
     side    : which side of the mouth the bubble sits on
     gap     : distance from the mouth to the bubble's near edge
     tipDx   : where the pointer tip ends, relative to the mouth
     bottomDy: bubble bottom relative to mouth height (negative = higher)
     Commander Lena's bubble sits in the sky between the two girls and
     Maya's sits in the sky to her right, so both girls, the house, the
     lantern and the sunset stay fully visible.                            */
  const IMG_W = 1536, IMG_H = 1024;
  const SPOTS = {
    lena: { x: 585, y: 268, side: "right", gap: 150, tipDx: 8, bottomDy: -18 },
    maya: { x: 925, y: 395, side: "right", gap: 190, tipDx: 8, bottomDy: 15 }
  };
  const WIDTHS = { short: 200, medium: 270, long: 360 };

  const speech      = document.getElementById("speech");
  const bubble      = document.getElementById("bubble");
  const tail        = document.getElementById("tail");
  const speakerName = document.getElementById("speakerName");
  const bubbleText  = document.getElementById("bubbleText");
  const btn         = document.getElementById("nextBtn");
  const skipBtn     = document.getElementById("skipBtn");

  let currentDialogue = 0;
  let current = null;
  let currentWidth = WIDTHS.short;
  let busy = false;
  let leaving = false;

  function positionBubble() {
    if (!current) return;
    const spot = SPOTS[current];
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = Math.max(vw / IMG_W, vh / IMG_H);
    const iw = IMG_W * s, ih = IMG_H * s;
    const ox = (vw - iw) / 2, oy = (vh - ih) / 2;

    const mx = ox + spot.x * s;
    const my = oy + spot.y * s;
    const margin = 10;

    const nearEdge = spot.side === "right" ? mx + spot.gap * s : mx - spot.gap * s;
    const avail = spot.side === "right" ? vw - nearEdge - margin : nearEdge - margin;
    let maxW = vw <= 700 ? Math.min(190, avail) : Math.min(currentWidth, vw * 0.32, avail);
    maxW = Math.max(maxW, 130);
    bubble.style.maxWidth = maxW + "px";

    const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
    let bx = spot.side === "right" ? nearEdge : nearEdge - bw;
    bx = Math.max(margin, Math.min(bx, vw - margin - bw));
    let by = spot.anchor === "top" ? my + spot.dy * s : my + spot.bottomDy * s - bh;
    by = Math.max(margin, Math.min(by, vh - margin - bh));
    const bottom = by + bh;

    bubble.style.left = bx + "px";
    bubble.style.top = by + "px";

    // Pointer: a small triangle whose base sits on the bubble edge and whose
    // tip stops part-way to the mouth (TAIL_LENGTH: 1 = reaches the mouth).
    const TAIL_LENGTH = 0.55;
    const fullX = mx + spot.tipDx * s, fullY = my;
    let p1, p2;
    if (spot.tailAt === "bottom") {          // base on the bubble's bottom edge
      const ex = spot.side === "left" ? bx + bw - 26 : bx + 56;
      p1 = [ex - 30, bottom - 1]; p2 = [ex, bottom - 1];
    } else {                                  // base on the side facing the mouth
      const ex = spot.side === "right" ? bx + 2 : bx + bw - 2;
      const t = spot.anchor === "top" ? by + 10 : Math.max(by + 10, bottom - 32);
      const u = spot.anchor === "top" ? by + 32 : Math.max(by + 20, bottom - 10);
      p1 = [ex, t]; p2 = [ex, u];
    }
    const sx = (p1[0] + p2[0]) / 2, sy = (p1[1] + p2[1]) / 2;
    const tip = [sx + (fullX - sx) * TAIL_LENGTH, sy + (fullY - sy) * TAIL_LENGTH];
    const xs = [p1[0], p2[0], tip[0]], ys = [p1[1], p2[1], tip[1]];
    const minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    const minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    tail.style.left = minX + "px";
    tail.style.top = minY + "px";
    tail.style.width = (maxX - minX) + "px";
    tail.style.height = (maxY - minY) + "px";
    tail.style.clipPath = "polygon(" +
      [p1, p2, tip].map(function (q) { return (q[0] - minX) + "px " + (q[1] - minY) + "px"; }).join(", ") + ")";

    speech.style.transformOrigin = mx + "px " + my + "px";
  }

  function showDialogue(i) {
    const d = dialogues[i];
    const reveal = function () {
      speakerName.textContent = d.name;
      bubbleText.textContent = d.text;
      current = d.position;
      currentWidth = WIDTHS[d.type] || WIDTHS.short;
      positionBubble();
      void speech.offsetWidth;
      speech.classList.add("show");
      btn.textContent = i === dialogues.length - 1 ? "CONTINUE" : "NEXT";
      btn.classList.add("show");
      skipBtn.classList.add("show");
      busy = false;
    };

    if (speech.classList.contains("show")) {
      busy = true;
      speech.classList.remove("show");
      setTimeout(reveal, 380);
    } else {
      reveal();
    }
  }

  function nextDialogue() {
    if (busy || leaving) return;
    if (currentDialogue >= dialogues.length - 1) {
      goToNextScene();
      return;
    }
    currentDialogue++;
    showDialogue(currentDialogue);
  }

  function goToNextScene() {
    if (leaving) return;
    leaving = true;
    window.location.href = "index3.html";
  }

  btn.addEventListener("click", nextDialogue);
  skipBtn.addEventListener("click", goToNextScene);   // Skip → index3.html right away
  document.addEventListener("click", function (e) {
    if (e.target !== btn && e.target !== skipBtn) nextDialogue();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      if (document.activeElement !== btn && document.activeElement !== skipBtn) {
        e.preventDefault();
        nextDialogue();
      }
    }
  });
  window.addEventListener("resize", positionBubble);

  window.addEventListener("load", function () {
    currentDialogue = 0;
    setTimeout(function () { showDialogue(0); }, 500);
  });
</script>
</body>
</html>
