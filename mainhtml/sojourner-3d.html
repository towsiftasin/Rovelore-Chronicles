<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ac:#ff7a3c;--fg:#eadfd6;--dim:#9a8a80;--line:rgba(255,122,60,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.o{font-family:Orbitron,'Segoe UI',sans-serif;letter-spacing:.2em;text-transform:uppercase}

#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s}
#hud.on{opacity:1}#hud>*{pointer-events:auto}
#brand{position:absolute;top:max(18px,env(safe-area-inset-top));left:22px;pointer-events:none!important}

#nav button b{font:600 10px Orbitron;color:var(--ac);margin-right:8px}
#nav button:hover,#nav button.act,#views button:hover{border-color:var(--ac);background:rgba(255,122,60,.16)}
#views{position:absolute;left:50%;transform:translateX(-50%);bottom:max(22px,env(safe-area-inset-bottom));display:flex;gap:6px}
#views button{text-align:center;font:500 10px Orbitron;letter-spacing:.16em;padding:9px 12px}
#panel{position:absolute;right:22px;bottom:max(22px,env(safe-area-inset-bottom));width:340px;padding:18px 20px;background:rgba(10,6,12,.78);backdrop-filter:blur(12px);border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%);opacity:0;transform:translateY(12px);pointer-events:none!important;transition:.4s}
#panel.on{opacity:1;transform:none;pointer-events:auto!important}
#panel .t{font:600 10px Orbitron;color:var(--ac);letter-spacing:.25em}#panel h3{margin:6px 0 4px;font:700 18px Orbitron;letter-spacing:.1em;text-transform:uppercase}
#panel .sp{font-size:12px;color:var(--dim);letter-spacing:.08em;margin-bottom:10px}
#panel h4{margin:12px 0 3px;font:500 10px Orbitron;letter-spacing:.22em;color:var(--ac)}#panel p{margin:0;font-size:15px;line-height:1.35;color:#d8cbc2}
#x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:20px;color:var(--dim)}
.hs{position:fixed;left:0;top:0;width:32px;height:32px;margin:-16px 0 0 -16px;border:1px solid var(--ac);border-radius:50%;background:rgba(255,122,60,.14);color:#ffb68f;font:600 10px Orbitron;display:grid;place-items:center;transition:opacity .3s,background .2s}
.hs::after{content:'';position:absolute;inset:-6px;border:1px solid var(--line);border-radius:50%;animation:p 2.2s infinite}
@keyframes p{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:0}}
.hs.occ{opacity:.22}.hs.act,.hs:hover{background:var(--ac);color:#150a05}
#tip{position:fixed;pointer-events:none;padding:4px 10px;font:500 10px Orbitron;letter-spacing:.16em;text-transform:uppercase;background:rgba(10,6,12,.85);border:1px solid var(--ac);opacity:0;transition:opacity .15s;white-space:nowrap}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 24px max(8vh,40px);background:linear-gradient(transparent 40%,rgba(5,3,10,.88));transition:opacity 1.2s;pointer-events:none}
#intro.off{opacity:0}#intro>*{pointer-events:auto}
#intro .s{font-size:11px;color:var(--ac)}#intro h2{margin:10px 0 8px;font-size:clamp(34px,8vw,76px);font-weight:700;letter-spacing:.28em}
#intro p{max-width:520px;margin:0 0 24px;font-size:17px;color:#cdbfb5;line-height:1.4}
#go{background:transparent;border:1px solid var(--ac);padding:14px 34px;font:600 12px Orbitron;letter-spacing:.3em;color:var(--ac);transition:.25s}#go:hover{background:var(--ac);color:#120804}
@media(max-width:720px){
#nav{top:auto;right:0;left:0;bottom:max(8px,env(safe-area-inset-bottom));width:auto;flex-direction:row;overflow-x:auto;padding:0 10px;gap:6px}
#nav button{white-space:nowrap;flex:0 0 auto}#views{display:none}
#id{bottom:auto;top:calc(max(18px,env(safe-area-inset-top)) + 46px);left:22px}#id h1{font-size:22px}
#panel{right:10px;left:10px;width:auto;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 56px)}#panel p{font-size:14px}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="brand" class="o"><b>Event Horizon</b><span>Mars Exploration Archive</span></div>

<div id="tip"></div>
<div id="intro"><div class="o s">Event Horizon · Interactive Exhibit</div><h2 class="o">Sojourner</h2>
<p>July 4, 1997. A rover the size of a microwave oven rolled down a ramp onto Mars — and changed how we explore other worlds.</p><button id="go">EXPLORE ROVER</button></div>

<script>
const $=s=>document.querySelector(s),V=(a,b,c)=>new THREE.Vector3(a,b,c);
const R=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.1;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05030a);scene.fog=new THREE.FogExp2(0x0b0508,0.013);
const cam=new THREE.PerspectiveCamera(40,1,.1,900);cam.position.set(17,7,19);
const ctl=new THREE.OrbitControls(cam,R.domElement);
Object.assign(ctl,{enableDamping:true,dampingFactor:.07,minDistance:3,maxDistance:45,maxPolarAngle:Math.PI/2-.03,screenSpacePanning:true,autoRotate:true,autoRotateSpeed:.7});ctl.target.set(0,1.3,0);

// ---------- environment (procedural IBL) ----------
(function(){const g=document.createElement('canvas');g.width=4;g.height=256;const x=g.getContext('2d'),gr=x.createLinearGradient(0,0,0,256);
[['#1a1a36',0],['#8a6a5a',.5],['#6a3018',.55],['#3a1a0e',1]].forEach(s=>gr.addColorStop(s[1],s[0]));x.fillStyle=gr;x.fillRect(0,0,4,256);
const e=new THREE.Scene();e.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(g),side:THREE.BackSide})));
const s=new THREE.Mesh(new THREE.SphereGeometry(5,16,8),new THREE.MeshBasicMaterial({color:new THREE.Color(7,5,3.5)}));s.position.set(-28,12,18);e.add(s);
scene.environment=new THREE.PMREMGenerator(R).fromScene(e).texture})();

// ---------- lighting ----------
const sun=new THREE.DirectionalLight(0xffd6b0,3.4);sun.position.set(-30,11,19);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:90});sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;scene.add(sun);
const fill=new THREE.DirectionalLight(0x4a6a9a,.35);fill.position.set(25,10,-15);scene.add(fill);scene.add(new THREE.HemisphereLight(0x6a5070,0x3a1a10,.3));

// ---------- textures ----------
function tex(base,dust,n,scr,rep){const c=document.createElement('canvas');c.width=c.height=256;const t=c.getContext('2d');t.fillStyle=base;t.fillRect(0,0,256,256);
for(let i=0;i<n;i++){const l=Math.random()>.5;t.fillStyle=`rgba(${l?255:0},${l?210:0},${l?170:0},${Math.random()*.3})`;t.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*5,1+Math.random()*5)}
for(let i=0;i<scr;i++){t.strokeStyle=`rgba(255,255,255,${Math.random()*.28})`;t.lineWidth=.6;t.beginPath();const a=Math.random()*256,b=Math.random()*256;t.moveTo(a,b);t.lineTo(a+Math.random()*44-22,b+Math.random()*8-4);t.stroke()}
if(dust)for(let i=0;i<14;i++){const x=Math.random()*256,y=Math.random()*256,g=t.createRadialGradient(x,y,0,x,y,40+Math.random()*50);g.addColorStop(0,dust);g.addColorStop(1,'rgba(0,0,0,0)');t.fillStyle=g;t.fillRect(0,0,256,256)}
const T=new THREE.CanvasTexture(c);T.wrapS=T.wrapT=THREE.RepeatWrapping;T.encoding=THREE.sRGBEncoding;T.anisotropy=4;if(rep)T.repeat.set(rep,rep);return T}
const D='rgba(176,96,56,.22)';
const M={alu:new THREE.MeshStandardMaterial({map:tex('#a9a9a6',D,2500,180),metalness:.85,roughness:.5}),
steel:new THREE.MeshStandardMaterial({map:tex('#8c8c8a',D,2500,200),metalness:.9,roughness:.42}),
gun:new THREE.MeshStandardMaterial({map:tex('#55555a',D,1800,120),metalness:.8,roughness:.55}),

M.rim=M.steel.clone();M.rim.side=THREE.DoubleSide;
(function(){const c=document.createElement('canvas');c.width=c.height=256;const t=c.getContext('2d'),g=t.createLinearGradient(0,0,256,256);g.addColorStop(0,'#14275a');g.addColorStop(1,'#0a1538');t.fillStyle=g;t.fillRect(0,0,256,256);
t.strokeStyle='rgba(150,165,205,.55)';t.lineWidth=1.5;for(let i=0;i<=12;i++){t.beginPath();t.moveTo(i*256/12,0);t.lineTo(i*256/12,256);t.stroke()}for(let i=0;i<=9;i++){t.beginPath();t.moveTo(0,i*256/9);t.lineTo(256,i*256/9);t.stroke()}
for(let i=0;i<10;i++){const x=Math.random()*256,y=Math.random()*256,r=t.createRadialGradient(x,y,0,x,y,70);r.addColorStop(0,'rgba(176,96,56,.2)');r.addColorStop(1,'rgba(0,0,0,0)');t.fillStyle=r;t.fillRect(0,0,256,256)}
const T=new THREE.CanvasTexture(c);T.encoding=THREE.sRGBEncoding;T.anisotropy=4;M.cell=new THREE.MeshStandardMaterial({map:T,metalness:.35,roughness:.3})})();

// ---------- rover (units: 1 = 10 cm; +Z forward) ----------
const rover=new THREE.Group();scene.add(rover);const P={};
const part=id=>{const g=new THREE.Group();g.userData={id,k:0};rover.add(g);return P[id]=g};
const add=(g,geo,m,x,y,z)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;g.add(o);return o};
const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d),cyl=(r,h,s=16,r2=r)=>new THREE.CylinderGeometry(r,r2,h,s);
function tube(g,a,b,r,m){a=V(...a);b=V(...b);const d=b.clone().sub(a),o=new THREE.Mesh(cyl(r,d.length(),10),m);o.position.copy(a).add(b).multiplyScalar(.5);o.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());o.castShadow=true;g.add(o)}
// body (warm electronics box)
const B=part('body');add(B,box(3.2,1.2,4.6),M.alu,0,1.65,0);
for(const s of[-1,1]){add(B,box(.03,.5,3.8),M.dark,s*1.61,1.7,0);add(B,box(.04,.18,1),M.gun,s*1.62,1.35,-1.4);for(let i=0;i<6;i++)add(B,cyl(.04,.05,6),M.steel,s*1.63,1.95,-1.9+i*.75).rotation.z=Math.PI/2}
add(B,box(2.4,.08,.7),M.gun,0,1.08,-.2);
add(B,box(1.4,.5,.4),M.gun,0,1.5,-2.45);add(B,cyl(.22,.3,16),M.steel,0,1.2,-2.78);add(B,cyl(.12,.05,12),M.dark,0,1.03,-2.78);   // rear APXS
tube(B,[0,1.5,-2.3],[0,1.35,-2.6],.05,M.steel);
// solar panel
const S=part('solar');add(S,box(3.45,.1,4.75),M.alu,0,2.31,0);const pl=add(S,new THREE.PlaneGeometry(3.25,4.55),M.cell,0,2.365,0);pl.rotation.x=-Math.PI/2;
// camera system (front)
const C=part('camera');add(C,box(2,.6,.5),M.gun,0,1.75,2.55);
for(const s of[-1,1]){const l=add(C,cyl(.17,.34,20),M.dark,s*.5,1.76,2.9);l.rotation.x=Math.PI/2;const g=add(C,cyl(.12,.03,20),M.lens,s*.5,1.76,3.08);g.rotation.x=Math.PI/2;
 const q=add(C,cyl(.06,.2,10),M.dark,s*.88,1.9,2.85);q.rotation.x=Math.PI/2;add(C,cyl(.035,.02,8),M.laser,s*.88,1.9,2.96).rotation.x=Math.PI/2}
add(C,cyl(.06,.2,10),M.dark,0,1.95,2.85).rotation.x=Math.PI/2;add(C,cyl(.035,.02,8),M.laser,0,1.95,2.96).rotation.x=Math.PI/2;
// antenna
const A=part('antenna');add(A,cyl(.1,.14,16),M.gun,-1.15,2.44,-1.9);const wh=add(A,cyl(.018,1.1,6),M.steel,-1.15,3.0,-1.9);wh.rotation.set(.08,0,.05);add(A,new THREE.SphereGeometry(.045,8,6),M.steel,-1.12,3.55,-1.86);
add(A,cyl(.12,.1,16),M.gun,1.1,2.42,-1.9);add(A,cyl(.05,.35,8),M.steel,1.1,2.64,-1.9);add(A,cyl(.08,.04,12),M.dark,1.1,2.84,-1.9);
// wheels
const W=part('wheels'),wG=cyl(.65,.6,40,.65),dG=cyl(.58,.05,32),hG=cyl(.18,.16),bG=cyl(.03,.06,6),rG=box(.5,.04,.08),cG=box(.09,.3,.05);
const wGo=new THREE.CylinderGeometry(.65,.65,.6,40,1,true);
function wheel(sx,z){const w=new THREE.Group();w.position.set(sx*2.1,.65,z);w.rotation.z=Math.PI/2;
 add(w,wGo,M.rim,0,0,0);add(w,dG,M.gun,0,-sx*.27,0);add(w,dG,M.gun,0,sx*.27,0);add(w,hG,M.steel,0,-sx*.33,0);
 for(let i=0;i<6;i++){const a=i/6*Math.PI*2,r=add(w,rG,M.steel,Math.cos(a)*.35,-sx*.3,Math.sin(a)*.35);r.rotation.y=-a;const b=add(w,bG,M.steel,Math.cos(a+.5)*.2,-sx*.36,Math.sin(a+.5)*.2)}
 const im=new THREE.InstancedMesh(cG,M.steel,48),d=new THREE.Object3D();let n=0;
 for(let i=0;i<24;i++){const a=i/24*Math.PI*2;for(const s of[-1,1]){d.position.set(Math.cos(a)*.67,s*.15,Math.sin(a)*.67);d.rotation.set(s*.35,-a,0,'YXZ');d.updateMatrix();im.setMatrixAt(n++,d.matrix)}}
 im.castShadow=im.receiveShadow=true;w.add(im);W.add(w)}
// suspension (rocker-bogie)
const U=part('suspension'),ZS=[2,0,-2.1];
for(const sx of[-1,1]){const x=sx*1.72,pr=[x,1.55,.4],pb=[x,1.25,-1];ZS.forEach(z=>wheel(sx,z));
 tube(U,[x,.65,2],pr,.08,M.gun);tube(U,[x,1.55,.4],pb,.09,M.gun);tube(U,[x,.65,0],pb,.08,M.gun);tube(U,[x,.65,-2.1],pb,.08,M.gun);
 [pr,pb].forEach(p=>add(U,new THREE.SphereGeometry(.14,12,8),M.steel,...p));ZS.forEach(z=>{tube(U,[x,.65,z],[sx*2.0,.65,z],.06,M.steel);add(U,new THREE.SphereGeometry(.1,10,8),M.steel,x,.65,z)});
 tube(U,[sx*1.6,1.55,.4],[x,1.55,.4],.07,M.steel)}
rover.traverse(o=>{if(o.material)o.material=o.material.clone()});

// ---------- Mars ----------
const hY=(x,z)=>{const r=Math.hypot(x,z),k=Math.min(1,Math.max(0,(r-5)/10));return k*k*(3-2*k)*(.5*Math.sin(x*.12)*Math.cos(z*.1)+.18*Math.sin(x*.5+z*.35)+.08*Math.sin(z*1.3-x*.9))};
const gg=new THREE.PlaneGeometry(260,260,170,170);gg.rotateX(-Math.PI/2);const gp=gg.attributes.position,col=[];
for(let i=0;i<gp.count;i++){const x=gp.getX(i),z=gp.getZ(i);gp.setY(i,hY(x,z));const v=.8+Math.random()*.25;col.push(v,v*.82,v*.72)}
gg.setAttribute('color',new THREE.Float32BufferAttribute(col,3));gg.computeVertexNormals();
const gm=new THREE.Mesh(gg,new THREE.MeshStandardMaterial({map:tex('#a4522b','rgba(120,50,25,.25)',9000,0,70),vertexColors:true,roughness:1,metalness:0,envMapIntensity:.4}));gm.receiveShadow=true;scene.add(gm);
const rockM=new THREE.MeshStandardMaterial({map:tex('#6e3d28','rgba(176,96,56,.3)',3000,0,1),roughness:.95,flatShading:true,envMapIntensity:.5});
for(let i=0;i<90;i++){const g=new THREE.IcosahedronGeometry(1,1),p=g.attributes.position;for(let j=0;j<p.count;j++){const f=.75+Math.random()*.5;p.setXYZ(j,p.getX(j)*f,p.getY(j)*f,p.getZ(j)*f)}g.computeVertexNormals();
 const r=new THREE.Mesh(g,rockM),a=Math.random()*6.283,d=i<14?4.5+Math.random()*5:7+Math.pow(Math.random(),.6)*70,s=(i<14?.12:.2)+Math.pow(Math.random(),3)*(i<14?.35:2.6);
 r.position.set(Math.cos(a)*d,hY(Math.cos(a)*d,Math.sin(a)*d)+s*.25,Math.sin(a)*d);r.scale.set(s,s*.6,s*.85);r.rotation.y=Math.random()*6;r.castShadow=r.receiveShadow=true;scene.add(r)}
// stars
{const n=1800,p=new Float32Array(n*3);for(let i=0;i<n;i++){const u=Math.random()*6.283,y=.03+Math.random()*.97,r=Math.sqrt(1-y*y)*500;p.set([Math.cos(u)*r,y*500,Math.sin(u)*r],i*3)}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.5,sizeAttenuation:false,color:0xcfd6ff,fog:false,transparent:true,opacity:.85})))}
// dust motes
const NP=520,dp=new Float32Array(NP*3);for(let i=0;i<NP;i++)dp.set([(Math.random()-.5)*50,Math.random()*9,(Math.random()-.5)*50],i*3);
const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dp,3));scene.add(new THREE.Points(dg,new THREE.PointsMaterial({size:.07,color:0xd9976a,transparent:true,opacity:.45,depthWrite:false})));

// ---------- information ----------
const H=[
{id:'solar',n:'Solar Panel',a:[0,2.55,.8],p:[4.5,6.5,6.5],t:[0,2.2,0],sp:'≈0.2 m² · GaAs cells · ~16 W peak',
w:'Converted Martian sunlight into electricity to run the drive motors, instruments and radio, while non-rechargeable lithium batteries covered nights and cold starts.',
y:'It proved that small solar-powered machines can work on Mars. The rover was designed for about 7 sols and operated for 83.'},
{id:'wheels',n:'Wheels',a:[2.6,.95,2],p:[7,2.2,6.5],t:[2,.7,1.3],sp:'6 wheels · 13 cm diameter · stainless-steel cleats',
w:'Six individually driven wheels with cleated treads carried the rover at a top speed of about 1 cm per second, climbing over rocks and crossing loose soil near the lander.',
y:'Its wheel tracks and occasional wheel digging revealed the strength and texture of Martian soil — data that guided every wheeled rover after it.'},
{id:'camera',n:'Camera & Imaging',a:[0,1.75,3.2],p:[2,2.6,8.5],t:[0,1.7,2.5],sp:'Stereo CCD cameras · laser light-stripers',
w:'Two front cameras and five laser stripers let the rover see the terrain ahead and detect hazards, while images were relayed through the lander to Earth.',
y:'It made limited autonomous driving possible, since commands from Earth were delayed by minutes — an early step toward self-navigating rovers.'},
{id:'antenna',n:'Antenna',a:[-1.15,3.1,-1.9],p:[-4.5,3.8,-5.5],t:[-1,2.6,-1.6],sp:'UHF whip antenna · radio modem to lander',
w:'The thin whip antenna linked the rover with the Pathfinder lander by radio. Sojourner could not talk to Earth directly; the lander relayed everything.',
y:'This relay design became the standard architecture for Mars surface missions, which later used orbiters as their data relays.'},
{id:'body',n:'Rover Body',a:[-1.7,1.95,1],p:[-7,3.5,3],t:[0,1.6,0],sp:'Warm electronics box · ~65 × 48 × 30 cm · 10.5 kg',
w:'An insulated box protected the computer and electronics from Martian cold, with small radioisotope heater units. At the rear, the APXS pressed against rocks to read their chemistry.',

// ---------- interaction ----------
const hud=$('#hud'),nav=$('#nav'),panel=$('#panel'),tip=$('#tip');let sel=null,hov=null,tw=null,mx=0,my=0,moved=false,fr=0,started=false;
H.forEach((h,i)=>{h.el=document.createElement('button');h.el.className='hs';h.el.textContent='0'+(i+1);h.el.onclick=()=>select(h.id);hud.appendChild(h.el);
 const b=document.createElement('button');b.innerHTML=`<b>0${i+1}</b>${h.n}`;b.onclick=()=>select(h.id);h.nb=b;nav.appendChild(b)});
const VW={FRONT:[[0,2.2,13],[0,1.4,0]],SIDE:[[13,2.2,0],[0,1.4,0]],TOP:[[0,15,.5],[0,1.2,0]],REAR:[[0,2.6,-13],[0,1.4,0]],'3/4':[[9,4.5,10.5],[0,1.3,0]]};
for(const k in VW){const b=document.createElement('button');b.textContent=k;b.onclick=()=>{close();fly(...VW[k])};$('#views').appendChild(b)}
function fly(p,t){const tt=V(...t),off=V(...p).sub(tt);if(cam.aspect<.9)off.multiplyScalar(1.6);tw={p0:cam.position.clone(),t0:ctl.target.clone(),p1:tt.clone().add(off),t1:tt,s:performance.now(),d:1200};ctl.autoRotate=false}
function select(id){const h=H.find(x=>x.id===id);sel=id;$('#pt').textContent='COMPONENT 0'+(H.indexOf(h)+1);$('#pn').textContent=h.n;$('#ps').textContent=h.sp;$('#pw').textContent=h.w;$('#py').textContent=h.y;
 panel.classList.add('on');H.forEach(x=>{x.nb.classList.toggle('act',x===h);x.el.classList.toggle('act',x===h)});fly(h.p,h.t)}
function close(){sel=null;panel.classList.remove('on');H.forEach(x=>{x.nb.classList.remove('act');x.el.classList.remove('act')})}
$('#x').onclick=close;addEventListener('keydown',e=>e.key==='Escape'&&close());
$('#go').onclick=()=>{started=true;$('#intro').classList.add('off');hud.classList.add('on');fly(...VW['3/4'])};
ctl.addEventListener('start',()=>{tw=null;ctl.autoRotate=false});
const rc=new THREE.Raycaster(),nd=new THREE.Vector2();
function pick(x,y){nd.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);rc.setFromCamera(nd,cam);rc.far=Infinity;const h=rc.intersectObject(rover,true)[0];if(!h)return null;let o=h.object;while(o&&!o.userData.id)o=o.parent;return o?o.userData.id:null}
let dx=0,dy=0;const cv=R.domElement;
cv.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;moved=true});
cv.addEventListener('pointerdown',e=>{dx=e.clientX;dy=e.clientY});
cv.addEventListener('pointerup',e=>{if(started&&Math.hypot(e.clientX-dx,e.clientY-dy)<6){const id=pick(e.clientX,e.clientY);if(id)select(id)}});
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();

// ---------- loop ----------
const clk=new THREE.Clock(),tv=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);fr++;
 if(tw){const k=Math.min(1,(performance.now()-tw.s)/tw.d),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;cam.position.lerpVectors(tw.p0,tw.p1,e);ctl.target.lerpVectors(tw.t0,tw.t1,e);if(k>=1)tw=null}
 ctl.target.y=Math.max(.2,ctl.target.y);ctl.update();
 if(moved&&started){moved=false;hov=pick(mx,my);const h=H.find(x=>x.id===hov);cv.style.cursor=h?'pointer':'grab';tip.style.opacity=h?1:0;if(h){tip.textContent=h.n;tip.style.left=mx+14+'px';tip.style.top=my+14+'px'}}
 for(const id in P){const g=P[id],u=g.userData,t=id===sel?1:id===hov?.8:0;u.k+=(t-u.k)*Math.min(1,dt*10);if(Math.abs(t-u.k)>.003||u.k>.003)g.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissive.setRGB(.45*u.k,.14*u.k,.03*u.k)})}
 if(started)H.forEach(h=>{tv.set(...h.a).project(cam);const vis=tv.z<1&&tv.z>-1;h.el.style.display=vis?'':'none';h.el.style.transform=`translate(${(tv.x+1)/2*innerWidth}px,${(1-tv.y)/2*innerHeight}px)`;
  if(vis&&fr%8===0){const p=V(...h.a),d=p.clone().sub(cam.position),L=d.length();rc.set(cam.position,d.normalize());rc.far=L-.4;h.el.classList.toggle('occ',rc.intersectObject(rover,true).length>0)}});
 const a=dg.attributes.position.array;for(let i=0;i<NP;i++){a[i*3]+=dt*(.6+(i%5)*.12);a[i*3+1]+=Math.sin(fr*.01+i)*.002;a[i*3+2]+=dt*.15;if(a[i*3]>25)a[i*3]=-25;if(a[i*3+2]>25)a[i*3+2]=-25}dg.attributes.position.needsUpdate=true;
 R.render(scene,cam)}loop();
