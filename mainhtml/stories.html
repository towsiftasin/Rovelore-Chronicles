<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rovelore Chronicles — Stories</title>
<!-- Same fonts as the home page -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Stories page – same look as the Rovelore Chronicles home page
   (Baloo 2 + Patrick Hand fonts, golden yellow hand-drawn details)
   ========================================================= */

:root {
  --bg: #0A1230;               /* deep navy (same as the logo's dark) */
  --blue: #3AA9E0;             /* logo blue */
  --yellow: #FFC928;           /* golden yellow used for stars, arrows, buttons */
  --text: #ffffff;
  --text-soft: #c9d3f0;
  --mars: #ff8a5c;             /* Mars accent */
  --moon: #8fc8ff;             /* Moon accent */
  --line: rgba(255, 255, 255, 0.16);
  --heading: "Baloo 2", "Trebuchet MS", sans-serif;
  --hand: "Patrick Hand", "Comic Sans MS", cursive;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

/* Background: plain navy for now. To use your image, replace with:
   background: var(--bg) url("../images/1st.jpg") center / cover no-repeat fixed;  */
body { font-family: var(--heading); color: var(--text); background: var(--bg); line-height: 1.5;
  background-image: url("../images/main/2nd.png"); background-size: cover; background-position: center; background-repeat: no-repeat;
  height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }  /* page doesn't scroll */

/* ---- Header: copied from your home page so the logo and links sit in the same place ---- */
.topbar { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 24px 48px 0; flex-wrap: wrap; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-name { font-size: 1.25rem; font-weight: 700; color: #FFFFFF; }
.mainnav { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
.nav-link { background: none; border: none; color: #FFFFFF; font-family: inherit; font-size: 1rem; font-weight: 600;
  cursor: pointer; padding: 4px 0; position: relative; }
.nav-link.active { color: #FFC928; }
.nav-link.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 3px;
  border-radius: 2px; background: #FFC928; }                       /* active page = gold underline */
.nav-link:hover:not(.active) { color: #FFC928; opacity: 0.85; }

main { width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 24px 24px;
  flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---- Hero ---- */
.hero { flex-shrink: 0; text-align: center; padding: 22px 0 20px; position: relative; }
.hero-title { font-size: clamp(40px, 7vw, 68px); font-weight: 800; line-height: 1.1;
  display: inline-flex; align-items: flex-start; gap: 8px; }
.hero-title svg { margin-top: 6px; animation: spin 8s linear infinite; }
@keyframes spin { 50% { transform: rotate(20deg) scale(1.15); } }
.swoop { display: block; margin: 0 auto; }
.subtitle { margin-top: 6px; font-family: var(--hand); font-size: clamp(20px, 3vw, 28px); color: var(--text-soft); }

/* ---- Story box: the page is fixed, only this box scrolls ---- */
.story-box { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.story-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; list-style: none;
  padding: 22px; display: flex; flex-direction: column; gap: 20px;
  background: rgba(6, 12, 40, 0.45); border: 2px solid rgba(8, 84, 117, 0.45); border-radius: 28px;
  scrollbar-width: thin; scrollbar-color: var(--yellow) transparent; }
.story-list::-webkit-scrollbar { width: 8px; }
.story-list::-webkit-scrollbar-thumb { background: var(--yellow); border-radius: 8px; }

/* ---- One story row ---- */
.story { display: grid; grid-template-columns: 60px 1fr auto; gap: 6px 22px; align-items: center;
  padding: 26px 30px; background: rgba(18, 30, 80, 0.7); border: 2px solid var(--line); border-radius: 24px;
  transition: transform .25s ease, border-color .25s ease, background .25s ease;
  opacity: 0; animation: rise .6s ease forwards; }
.story.mars { --accent: var(--mars); }
.story.moon { --accent: var(--moon); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.story:hover { transform: translateY(-4px); border-color: var(--accent); background: rgba(26, 42, 105, 0.85); }

/* Number in a round badge, like a sticker */
.story-num { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%;
  font-size: 26px; font-weight: 800; color: var(--bg); background: var(--accent); }

.story h2 { display: flex; align-items: center; gap: 10px; font-size: clamp(22px, 3vw, 28px); font-weight: 700; line-height: 1.2; }
.icon { display: inline-block; width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
.mars-icon { background: radial-gradient(circle at 35% 30%, #ffc3a3, var(--mars) 60%, #a8431f); }
.moon-icon { background: radial-gradient(circle at 35% 30%, #fff, var(--moon) 60%, #5d7fa8); }

.meta { margin-top: 2px; font-family: var(--hand); font-size: 20px; color: var(--accent); }
.story p { margin-top: 6px; font-family: var(--hand); font-size: 19px; color: var(--text-soft); max-width: 560px; }

/* Yellow rounded button, like "Start the Story" on the home page */
.read-btn { font-family: var(--heading); font-weight: 700; font-size: 16px; white-space: nowrap;
  color: #1a1400; background: var(--yellow); border: none; border-radius: 999px; padding: 11px 24px; cursor: pointer;
  box-shadow: 0 4px 0 #c99500; transition: transform .2s, box-shadow .2s; }
.read-btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 6px 0 #c99500; }
.read-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c99500; }
.read-btn span { display: inline-block; transition: transform .2s; }
.read-btn:hover span { transform: translateX(4px); }
.read-btn:focus-visible, .nav-link:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

/* ---- STORY POP-UP (opens when "Read Story" is clicked) ---- */
.story-modal { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
  padding: 20px; background: rgba(0, 0, 0, 0.7); }
.story-modal.open { display: flex; }

.story-card { --accent: var(--mars); position: relative; width: 100%; max-width: 760px; max-height: 88vh;
  display: flex; flex-direction: column; background: #0d1a4a; border: 3px solid var(--accent); border-radius: 26px;
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.5); animation: pop .25s ease; }
.story-card.moon { --accent: var(--moon); }
@keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: none; } }

.story-card-head { flex-shrink: 0; padding: 22px 64px 14px 28px; border-bottom: 2px solid var(--line); }
.story-card-head h2 { font-size: clamp(22px, 3.2vw, 32px); font-weight: 800; line-height: 1.2; }
.story-card-head .meta { margin-top: 4px; }

.modal-close { position: absolute; top: 14px; right: 18px; width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.1); border: none; color: #fff; font-size: 1.7rem; line-height: 1; cursor: pointer; }
.modal-close:hover { background: var(--yellow); color: #1a1400; }
.modal-close:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

.story-card-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 28px 28px; overscroll-behavior: contain;
  scrollbar-width: thin; scrollbar-color: var(--yellow) transparent; }
.story-card-body::-webkit-scrollbar { width: 8px; }
.story-card-body::-webkit-scrollbar-thumb { background: var(--yellow); border-radius: 8px; }

.story-section + .story-section { margin-top: 22px; }
.story-section h3 { font-size: 1.25rem; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.story-section p, .story-section li { font-family: var(--hand); font-size: 20px; line-height: 1.45; color: var(--text-soft); }
.story-section ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.story-section li { position: relative; padding-left: 22px; }
.story-section li::before { content: ""; position: absolute; left: 2px; top: 0.6em; width: 9px; height: 9px;
  border-radius: 50%; background: var(--yellow); }
.story-section li b { color: #fff; font-family: var(--heading); font-weight: 700; font-size: 0.92em; }

.coming-soon { font-family: var(--hand); font-size: 22px; color: var(--text-soft); text-align: center; padding: 28px 0; }

/* ---- Responsive ---- */
@media (max-width: 640px) {
  .topbar { flex-direction: column; align-items: flex-start; gap: 14px; padding: 20px 24px 12px; }
  .mainnav { gap: 16px; font-size: 0.95rem; }
  main { padding: 0 12px 12px; }
  .story-list { padding: 12px; gap: 14px; border-radius: 22px; }
  .story { grid-template-columns: 44px 1fr; padding: 20px 16px; gap: 6px 14px; }
  .story-num { width: 42px; height: 42px; font-size: 21px; }
  .story .read-btn { grid-column: 2; justify-self: start; margin-top: 8px; }
  .story-modal { padding: 10px; }
  .story-card-head { padding: 18px 56px 12px 18px; }
  .story-card-body { padding: 16px 18px 22px; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>

  <!-- HEADER (same as the home page; "Stories" is the active link) -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 48 40" width="36" height="30">
          <ellipse cx="22" cy="22" rx="19" ry="6.5" fill="none" stroke="#FFC928" stroke-width="2.5" transform="rotate(-18 22 22)"/>
          <circle cx="22" cy="20" r="10" fill="#3AA9E0"/>
          <circle cx="18" cy="16" r="2.6" fill="#0A1230" opacity="0.35"/>
          <path d="M40 6 L41.4 9.6 L45 11 L41.4 12.4 L40 16 L38.6 12.4 L35 11 L38.6 9.6 Z" fill="#FFC928"/>
          <path d="M6 26 L6.8 28 L8.8 28.8 L6.8 29.6 L6 31.6 L5.2 29.6 L3.2 28.8 L5.2 28 Z" fill="#FFC928"/>
        </svg>
      </span>
      <span class="brand-name">Rovelore Chronicles</span>
    </div>
    <nav class="mainnav" aria-label="Main navigation">
      <button class="nav-link" data-nav="home">Home</button>
      <button class="nav-link" data-nav="start">Start the Journey</button>
      <button class="nav-link active" data-nav="stories" aria-current="page">Stories</button>
      <button class="nav-link" data-nav="explore">Explore</button>
      <button class="nav-link" data-nav="about">About</button>
    </nav>
  </header>

  <main>
    <!-- TITLE -->
    <section class="hero">
      <h1 class="hero-title">Stories
        <svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">
          <path d="M20 0 L24 16 L40 20 L24 24 L20 40 L16 24 L0 20 L16 16 Z" fill="#FFC928"/>
        </svg>
      </h1>
      <svg class="swoop" viewBox="0 0 80 24" width="90" height="20" aria-hidden="true">
        <path d="M2 20 C 24 2, 56 2, 78 14" fill="none" stroke="#FFC928" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <p class="subtitle">Every machine left behind has a story to tell.</p>
    </section>

    <!-- STORY LIST (rows are built by the script below) -->
    <section class="story-box" aria-label="All stories">
      <ol class="story-list" id="storyList"></ol>
    </section>
  </main>

  <!-- STORY POP-UP (filled by the script when "Read Story" is clicked) -->
  <div class="story-modal" id="storyModal">
    <div class="story-card" id="storyCard" role="dialog" aria-modal="true" aria-labelledby="storyTitle">
      <button class="modal-close" id="storyClose" type="button" aria-label="Close">&times;</button>
      <div class="story-card-head">
        <h2 id="storyTitle">Story</h2>
        <div class="meta" id="storyMeta"></div>
      </div>
      <div class="story-card-body" id="storyBody"></div>
    </div>
  </div>

<script>
/* =========================================================
   Stories page – JavaScript
   1) Header navigation  2) Missions + stories  3) Build the list  4) Story pop-up
   ========================================================= */

// 1) Header navigation – same procedure as the home page: a routes object + data-nav buttons.
document.addEventListener('DOMContentLoaded', () => {
  const routes = {
    home: '../index.html',
    start: 'index3.html',
    stories: 'stories.html',
    explore: 'explore.html',
    about: 'about.html'
  };

  document.querySelectorAll('[data-nav]').forEach((el) => {
    el.addEventListener('click', () => {
      const key = el.getAttribute('data-nav');
      const dest = routes[key];
      if (dest) {
        window.location.href = dest;
      }
    });
  });
});

/* 2) The missions object (same missions as the Mars and Moon pages).
   Each entry needs: name, world ("mars" or "moon"), location, mission.
   "description" is optional.
   "story" is optional: add one to show a full story in the pop-up.
   A story is { title, sections: [ { h: "heading", p: "paragraph" }  or  { h: "heading", list: [ ... ] } ] }
   Entries without a "story" show a "coming soon" message. */
const missions = {
  /* ---------- MARS ---------- */
  sojourner: {
    name: "Sojourner Rover", world: "mars", location: "Ares Vallis", mission: "Mars Pathfinder (1997)",
    story: {
      title: "Sojourner Rover \u2013 Mission Summary",
      sections: [
        { h: "Summary",
          p: "Sojourner was NASA's first successful Mars rover, launched on December 4, 1996, as part of the Mars Pathfinder mission. It landed in Ares Vallis on July 4, 1997, to explore Martian rocks and soil and test robotic mobility. Equipped with six wheels, cameras and the APXS instrument, it collected valuable scientific data and captured over 550 images. Although designed for a seven-day mission, Sojourner operated for approximately 83 days. Its achievements laid the foundation for future Mars rover missions and opened a new chapter in robotic planetary exploration." }
      ]
    }
  },
  opportunity: {
    name: "Opportunity Rover", world: "mars", location: "Endeavour Crater", mission: "Mars Exploration Rover (2004)",
    story: {
      title: "Opportunity Rover \u2013 Mission Summary",
      sections: [
        { h: "Summary",
          p: "Opportunity was NASA's second Mars Exploration Rover, launched in 2003 and landed on Mars in January 2004. Its primary mission was to investigate Martian rocks and search for evidence of ancient water. It discovered important geological clues, including sulfate-rich rocks and an iron-nickel meteorite. Originally designed for 90 Martian days, Opportunity operated for nearly 15 years and traveled approximately 45.16 kilometers. Its mission ended in February 2019 after a massive dust storm disrupted its power supply. Its discoveries greatly improved our understanding of Mars' ancient environment and geological history." }
      ]
    }
  },
  spirit: {
    name: "Spirit Rover", world: "mars", location: "Gusev Crater", mission: "Mars Exploration Rover (2004)",
    story: {
      title: "Spirit Rover \u2013 Mission Summary",
      sections: [
        { h: "Summary",
          p: "Spirit was one of NASA's twin Mars Exploration Rovers, launched in 2003 to investigate the Martian surface. It explored Gusev Crater, analyzed rocks and minerals, and uncovered important clues about Mars' geological past. Despite facing difficult terrain, mechanical failures, and harsh environmental conditions, Spirit operated for over six years, far beyond its planned mission lifetime. Its remarkable discoveries and achievements helped advance robotic exploration and shaped the future of Mars missions." }
      ]
    }
  },
  insight: {
    name: "InSight Lander", world: "mars", location: "Elysium Planitia", mission: "InSight (2018)",
    story: {
      title: "InSight Lander \u2013 Mission Summary",
      sections: [
        { h: "Summary",
          p: "NASA's InSight lander arrived on Mars on November 26, 2018, to explore the planet's internal structure and geological activity. Using advanced instruments like SEIS and RISE, it studied marsquakes, the Martian core and underground processes. Despite challenges with its HP\u00b3 probe and declining solar power, InSight delivered groundbreaking scientific data. It detected over 1,300 seismic events and provided valuable insights into Mars' interior. The mission officially ended on December 21, 2022, leaving a lasting contribution to planetary science." }
      ]
    }
  },

  /* ---------- MOON ---------- */
  lrv: {
    name: "Lunar Roving Vehicle", world: "moon", location: "Apollo 15, 16 and 17 landing sites", mission: "Apollo 15, 16 and 17",
    story: {
      title: "Lunar Roving Vehicle \u2013 Mission Summary",
      sections: [
        { h: "Summary",
          p: "The Lunar Roving Vehicle (LRV), also known as the Moon Buggy, was developed by NASA to help astronauts explore the lunar surface. It was used during Apollo 15, 16 and 17, allowing astronauts to travel greater distances and collect valuable lunar samples. Equipped with electric motors, rechargeable batteries and navigation systems, it covered approximately 90.4 kilometres across three missions. After completing its missions, all three vehicles were left on the Moon. The LRV became a major milestone in lunar exploration and paved the way for future planetary rovers." }
      ]
    }
  },
  sws: {
    name: "Solar Wind Spectrometer", world: "moon", location: "Apollo 12 and 15 landing sites", mission: "Apollo 12 and Apollo 15",
    story: {
      title: "Solar Wind Spectrometer \u2013 Mission Summary",
      sections: [
        { h: "Summary",
          p: "The Solar Wind Spectrometer was deployed during NASA's Apollo 12 mission in 1969 to study charged particles released by the Sun. Equipped with seven Faraday cups, it measured the energy, direction and properties of solar wind particles. Its observations helped scientists understand how solar wind interacts with the Moon and Earth's magnetic field. The instrument continued collecting valuable scientific data until its operational mission ended in 1977. Its findings contributed significantly to our understanding of space plasma and the lunar environment." }
      ]
    }
  },
  surveyor1: {
    name: "Surveyor 1", world: "moon", location: "Oceanus Procellarum", mission: "Surveyor 1 (1966)",
    story: {
      title: "Surveyor 1 \u2013 Mission Summary",
      sections: [
        { h: "Summary",
          p: "Surveyor 1 was NASA's first successful American spacecraft to soft-land on the Moon, arriving on June 2, 1966. It captured more than 11,000 images and studied the lunar surface to understand its soil properties and landing conditions. Its findings helped scientists confirm that the lunar surface could support spacecraft. The mission provided valuable knowledge for the Apollo program and future human lunar exploration. After months of successful operations, communication permanently ended on January 7, 1967." }
      ]
    }
  },
  ranger7: {
    name: "Ranger 7", world: "moon", location: "Mare Cognitum", mission: "Ranger 7 (1964)",
    story: {
      title: "Ranger 7 \u2013 Mission Summary",
      sections: [
        { h: "Summary",
          p: "Ranger 7 was NASA's first successful spacecraft to capture close-up images of the Moon. Launched on July 28, 1964, it transmitted 4,316 photographs before impacting Mare Cognitum on July 31, 1964. Its images revealed previously unseen details of the lunar surface and craters. The mission provided valuable information for identifying safe landing areas for future Apollo missions. Ranger 7 marked a major milestone in lunar exploration and paved the way for later missions." }
      ]
    }
  }
};

// 3) Build one row of the story list
function createRow(key, m, number, delay) {
  const row = document.createElement("li");
  row.className = "story " + m.world;           // "mars" or "moon" sets the accent colour
  row.style.animationDelay = delay + "s";

  row.innerHTML =
    '<span class="story-num"></span>' +
    "<div>" +
      '<h2><span class="icon ' + m.world + '-icon" aria-hidden="true"></span><span class="name"></span></h2>' +
      '<div class="meta"></div>' +
      "<p></p>" +
    "</div>" +
    '<button class="read-btn" type="button">Read Story</button>';

  row.querySelector(".story-num").textContent = number;
  row.querySelector(".name").textContent = m.name;
  row.querySelector(".meta").textContent = m.location + "  \u00b7  " + m.mission;

  const desc = row.querySelector("p");
  if (m.description) { desc.textContent = m.description; } else { desc.remove(); }

  // 4) Open the story pop-up
  row.querySelector(".read-btn").addEventListener("click", function () {
    openStory(key);
  });
  return row;
}

const list = document.getElementById("storyList");
Object.keys(missions).forEach(function (key, i) {
  list.appendChild(createRow(key, missions[key], i + 1, i * 0.08));
});

/* =========================================================
   4) STORY POP-UP
   ========================================================= */
const modal    = document.getElementById("storyModal");
const card     = document.getElementById("storyCard");
const closeBtn = document.getElementById("storyClose");
const titleEl  = document.getElementById("storyTitle");
const metaEl   = document.getElementById("storyMeta");
const bodyEl   = document.getElementById("storyBody");
let lastButton = null;   // so focus goes back to the button that opened the story

// "Launch Date: December 4, 1996"  ->  bold label + text
function addListItem(ul, text) {
  const li = document.createElement("li");
  const i = text.indexOf(": ");
  if (i > 0 && i < 30) {
    const b = document.createElement("b");
    b.textContent = text.slice(0, i + 1);
    li.appendChild(b);
    li.appendChild(document.createTextNode(" " + text.slice(i + 2)));
  } else {
    li.textContent = text;
  }
  ul.appendChild(li);
}

function openStory(key) {
  const m = missions[key];
  if (!m) return;

  lastButton = document.activeElement;
  card.className = "story-card " + m.world;
  titleEl.textContent = (m.story && m.story.title) ? m.story.title : m.name;
  metaEl.textContent = m.location + "  \u00b7  " + m.mission;
  bodyEl.textContent = "";
  bodyEl.scrollTop = 0;

  if (m.story && m.story.sections) {
    m.story.sections.forEach(function (s) {
      const sec = document.createElement("section");
      sec.className = "story-section";

      const h = document.createElement("h3");
      h.textContent = s.h;
      sec.appendChild(h);

      if (s.p) {
        const p = document.createElement("p");
        p.textContent = s.p;
        sec.appendChild(p);
      }
      if (s.list) {
        const ul = document.createElement("ul");
        s.list.forEach(function (t) { addListItem(ul, t); });
        sec.appendChild(ul);
      }
      bodyEl.appendChild(sec);
    });
  } else {
    const soon = document.createElement("p");
    soon.className = "coming-soon";
    soon.textContent = "This story is coming soon. Check back later, explorer!";
    bodyEl.appendChild(soon);
  }

  modal.classList.add("open");
  closeBtn.focus();
}

function closeStory() {
  modal.classList.remove("open");
  if (lastButton) lastButton.focus();
}

closeBtn.addEventListener("click", closeStory);
modal.addEventListener("click", function (e) { if (e.target === modal) closeStory(); });
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && modal.classList.contains("open")) closeStory();
});
</script>
</body>
</html>
